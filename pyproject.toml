[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-system-controller"
version = "0.1.0"
description = "Control system volume and brightness using hand gestures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe",
    "numpy",
    "opencv-python",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
